/J2/ur/B5ZeOc1QvRAA"};
    function send(command, value) { frame.contentWindow.postMessage({ scope: "rhine-projection-ui-review", command, value }, "*"); }
    function layout() {
      const hidden = document.body.classList.contains("review-hidden");
      const dimensions = size.value === "auto" ? [Math.max(320, innerWidth - (hidden ? 0 : 28)), Math.max(400, innerHeight - (hidden ? 0 : document.querySelector(".review-toolbar").offsetHeight + 28))] : size.value.split("x").map(Number);
      frame.style.width = dimensions[0] + "px"; frame.style.height = dimensions[1] + "px";
    }
    document.querySelectorAll("[data-command]").forEach(button => button.addEventListener("click", () => send(button.dataset.command)));
    document.getElementById("review-dark").addEventListener("change", event => send("theme", event.target.checked));
    document.getElementById("review-reduced").addEventListener("change", event => send("reduced", event.target.checked));
    size.addEventListener("change", layout); window.addEventListener("resize", layout);
    document.getElementById("review-hide").addEventListener("click", () => { document.body.classList.add("review-hidden"); document.getElementById("review-restore").hidden = false; layout(); });
    document.getElementById("review-restore").addEventListener("click", () => { document.body.classList.remove("review-hidden"); document.getElementById("review-restore").hidden = true; layout(); });
    window.addEventListener("message", event => {
      if (event.source !== frame.contentWindow || event.data?.scope !== "rhine-projection-ui-review") return;
      if (event.data.event === "error") { errors.textContent += event.data.message + "\n"; return; }
      const { width, height, stats, reduced } = event.data;
      status.textContent = width + " × " + height + " · " + (stats.kind || "closed") + " · " + (stats.phase || "closed") + " · " + (reduced ? "减少动态" : "完整交互动态") + " · source " + identity.sourceDigest.slice(0, 12);
      document.getElementById("review-report").textContent = JSON.stringify({ identity, current: event.data }, null, 2);
    });
    async function loadFrame(payload = framePayload) {
      let documentHTML = payload.data;
      if (payload.encoding === "gzip-base64") {
        if (typeof DecompressionStream !== "function") throw new Error("浏览器不支持本预览所需的 gzip 解压，请使用未压缩的验收包。");
        const compressed = Uint8Array.from(atob(payload.data), character => character.charCodeAt(0));
        const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
        documentHTML = await new Response(stream).text();
      }
      frame.srcdoc = documentHTML;
    }
    // File.text stays in this page. There is no upload endpoint or network write.
    document.getElementById("review-local").addEventListener("change", async event => {
      const file = event.target.files?.[0]; if (!file) return;
      errors.textContent = ""; status.textContent = "正在读取本地公开验收包…";
      try {
        const text = await file.text();
        const payloadMatch = text.match(/const framePayload = ([^\n]+);\r?\n/);
        const identityMatch = text.match(/(?:const|let) identity = ([^\n]+);\r?\n/);
        if (payloadMatch && identityMatch) {
          const nextIdentity = JSON.parse(identityMatch[1]);
          if (nextIdentity.content !== "public synthetic fixture only") throw new Error("此入口只接受公开合成验收包。");
          identity = nextIdentity; await loadFrame(JSON.parse(payloadMatch[1]));
        } else {
          const parsed = new DOMParser().parseFromString(text, "text/html");
          if (parsed.querySelector('meta[name="rhine-review-content"]')?.content !== "public-synthetic") throw new Error("文件不是公开生产组件验收页。");
          identity = { content: "public synthetic fixture only", sourceDigest: parsed.querySelector('meta[name="rhine-review-source"]')?.content || "local", loadedFile: file.name };
          await loadFrame({ encoding: "plain", data: text });
        }
        document.getElementById("review-dark").checked = false;
        document.getElementById("review-reduced").checked = false;
      } catch (error) { status.textContent = "本地验收包载入失败"; errors.textContent = String(error); }
      event.target.value = "";
    });
    layout();
    loadFrame().catch(error => { status.textContent = "验收页面载入失败"; errors.textContent = String(error); });
  </script>
